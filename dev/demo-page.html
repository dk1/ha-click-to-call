<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Maple Street Dental – Contact</title>
  <style>
    body { margin: 0; font: 17px/1.6 Georgia, serif; color: #2b2b2b; background: #faf8f4; }
    header { background: #2f5d50; color: #fff; padding: 14px 28px; font: 600 19px system-ui, sans-serif; }
    main { margin: 22px 28px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .card { background: #fff; border: 1px solid #e6e1d8; border-radius: 10px; padding: 14px 20px 2px; margin: 16px 0 0; }
    .label { font: 600 13px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: #7a7266; }
    p { margin: 4px 0 14px; }
  </style>
</head>
<body>
  <header>Maple Street Dental</header>
  <main>
    <h1>Contact us</h1>
    <p>We're open Monday to Saturday. Call to book a cleaning or check-up.</p>
    <div class="card">
      <div class="label">Front desk</div>
      <p id="front-desk">(905) 555&nbsp;0142</p>
      <div class="label">Emergencies</div>
      <p>1-800-555-0199</p>
      <div class="label">Address</div>
      <p>214 Maple Street, Oakville</p>
    </div>
  </main>
</body>
</html>
