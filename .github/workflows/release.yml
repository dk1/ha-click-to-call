# Push a tag matching the manifest version to release it:
#   git tag v1.0.1 && git push origin v1.0.1
# Builds the zip, attaches it to a GitHub release, and publishes to the Chrome Web Store
# once these secrets are set (submit the first version by hand):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: node dev/check-extension.mjs
      - run: npx --yes web-ext build --source-dir extension --artifacts-dir dist --filename "ha-click-to-call-{version}.zip"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/ha-click-to-call-$VERSION.zip" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Chrome Web Store
        if: env.CWS_EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@3 --source "dist/ha-click-to-call-$VERSION.zip"
